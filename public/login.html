<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="description" content="Secure telemetric operations and fleet diagnostics login for Auto Repair Hub."/>
    <meta content="web_blank" name="shell-type"/>
    <title>Auto Repair Hub - Telemetric Operations Login</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico"/>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css"/>
    <style>
        @layer base {
            html, body { margin: 0; padding: 0; }
            body { overscroll-behavior: none; }
            main > :first-child { margin-top: 0 !important; }
            main > :last-child { margin-bottom: 0 !important; }
        }
        ::-webkit-scrollbar { display: none; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-fixed": "#e2e2e2",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#002202",
                        "on-error": "#ffffff",
                        "inverse-primary": "#c6c6c7",
                        "outline-variant": "#c1c6d5",
                        "on-secondary-fixed": "#00174c",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1c1b1b",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#dbe1ff",
                        "on-secondary-container": "#fefcff",
                        "on-primary-container": "#747676",
                        "on-background": "#1c1b1b",
                        "surface-container": "#f1edec",
                        "surface-dim": "#ddd9d9",
                        "on-primary": "#ffffff",
                        "secondary-container": "#2b69fa",
                        "secondary-fixed-dim": "#b4c5ff",
                        "surface-container-high": "#ebe7e7",
                        "secondary": "#0050d7",
                        "on-secondary-fixed-variant": "#003da9",
                        "on-tertiary-fixed-variant": "#00530a",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#c6c6c7",
                        "on-tertiary-container": "#008918",
                        "on-primary-fixed": "#1a1c1c",
                        "outline": "#747878",
                        "inverse-surface": "#313030",
                        "surface-bright": "#fcf8f8",
                        "inverse-on-surface": "#f4f0ef",
                        "tertiary-fixed": "#74ff6c",
                        "background": "#fcf8f8",
                        "on-surface-variant": "#444748",
                        "tertiary": "#006e11",
                        "on-primary-fixed-variant": "#454747",
                        "surface-tint": "#5d5f5f",
                        "primary-container": "#ffffff",
                        "surface-container-highest": "#e5e2e1",
                        "surface-container-low": "#f2f3fd",
                        "tertiary-container": "#ffffff",
                        "primary": "#5d5f5f",
                        "surface-variant": "#e5e2e1",
                        "tertiary-fixed-dim": "#00e630",
                        "surface": "#fcf8f8"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "space-md": "1rem",
                        "gutter": "1rem",
                        "space-xl": "2rem",
                        "space-lg": "1.5rem",
                        "space-xs": "0.25rem",
                        "margin": "1.5rem",
                        "space-sm": "0.5rem"
                    },
                    fontFamily: {
                        "headline-lg": ["Inter", "sans-serif"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }]
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen antialiased">
<main class="w-full min-h-screen flex items-center justify-center p-space-lg bg-surface">
<div class="flex flex-col w-full items-center justify-center relative overflow-hidden py-space-xl">
    <!-- Ambient Atmospheric Glowing Backdrops -->
    <div class="absolute -top-32 -left-20 w-[600px] h-[600px] rounded-full bg-[#2b69fa]/15 blur-[120px] pointer-events-none"></div>
    <div class="absolute top-[35%] -right-32 w-[550px] h-[550px] rounded-full bg-[#008817]/15 blur-[100px] pointer-events-none"></div>
    <div class="absolute -bottom-40 left-[20%] w-[500px] h-[500px] rounded-full bg-[#737575]/20 blur-[100px] pointer-events-none"></div>

    <!-- Decorative Blueprint Grid Texture Layer -->
    <div class="absolute inset-0 bg-[radial-gradient(#0050d7_1px,transparent_1px)] [background-size:28px_28px] opacity-10 pointer-events-none"></div>

    <!-- Main Viewport Wrap -->
    <div class="relative w-full max-w-md mx-auto px-4 z-10">
        <!-- Frosted Glass Core Authentication Card -->
        <div class="relative w-full rounded-2xl bg-surface-container-low/75 backdrop-blur-2xl shadow-[0_8px_32px_0_rgba(0,0,0,0.1)] p-6 sm:p-8 flex flex-col border border-outline-variant/30">
            <!-- Brand Crest & Header -->
            <div class="flex flex-col items-center text-center mb-8">
                <div class="relative group mb-4">
                    <div class="absolute -inset-1 rounded-2xl bg-gradient-to-r from-secondary to-secondary-container opacity-40 blur transition duration-500 group-hover:opacity-75"></div>
                    <div class="relative w-20 h-20 rounded-2xl overflow-hidden bg-surface-container flex items-center justify-center shadow-lg shadow-secondary/20 p-1 border border-outline-variant/40">
                        <!-- Local Brand Emblem Logo -->
                        <img alt="Auto Repair Hub Crest" class="w-full h-full object-contain drop-shadow" src="images/logo.png"/>
                    </div>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-on-surface">Auto Repair Hub</h1>
                <p class="text-sm text-on-surface-variant mt-1 max-w-xs font-normal">Fleet Diagnostics &amp; Operations Portal</p>
            </div>

            <!-- Authentication Form -->
            <form class="flex flex-col space-y-4" id="authForm" onsubmit="handleAuthSubmit(event)">
                <!-- Work Email / Username Field -->
                <div class="space-y-1.5">
                    <label for="userField" class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Work Email / Username</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none transition-colors duration-200">alternate_email</span>
                        <input class="w-full bg-surface-container/60 hover:bg-surface-container focus:bg-surface-container-lowest text-on-surface text-sm rounded-xl pl-11 pr-4 py-3 outline-none transition-all placeholder:text-outline/70 border border-outline-variant/40 focus:border-secondary focus:shadow-md focus:shadow-secondary/10" id="userField" placeholder="e.g. admin or m.vance@hub.com" required="" type="text" autocomplete="username" autofocus/>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label for="passwordField" class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Password</label>
                    </div>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none transition-colors duration-200">lock</span>
                        <input class="w-full bg-surface-container/60 hover:bg-surface-container focus:bg-surface-container-lowest text-on-surface text-sm rounded-xl pl-11 pr-11 py-3 outline-none transition-all placeholder:text-outline/70 border border-outline-variant/40 focus:border-secondary focus:shadow-md focus:shadow-secondary/10" id="passwordField" placeholder="Enter password" required="" type="password" autocomplete="current-password"/>
                        <button aria-label="Toggle password visibility" class="absolute right-3.5 text-outline hover:text-on-surface p-1 rounded-md transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
                            <span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Device Persistence -->
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center space-x-2.5 cursor-pointer select-none">
                        <input checked="" class="w-4 h-4 rounded text-secondary focus:ring-0 cursor-pointer accent-secondary" type="checkbox"/>
                        <span class="text-xs text-on-surface-variant font-medium">Remember terminal</span>
                    </label>
                </div>

                <!-- Primary CTA Button -->
                <button class="relative group w-full mt-2 py-3.5 px-6 rounded-xl font-semibold text-sm text-on-secondary shadow-lg shadow-secondary/25 transition-all duration-300 overflow-hidden bg-gradient-to-r from-secondary via-secondary-container to-secondary hover:shadow-secondary/40 active:scale-[0.99] flex items-center justify-center space-x-2 cursor-pointer" id="submitBtn" type="submit">
                    <span class="material-symbols-outlined text-[18px]">key</span>
                    <span id="btnText">Sign In to Hub</span>
                    <span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
                </button>
            </form>

            <!-- Alternative Quick Role Sign-In -->
            <div class="relative my-6 flex items-center justify-center">
                <div class="w-full h-px bg-surface-container-high"></div>
                <span class="absolute bg-surface-container-lowest px-3 text-[11px] uppercase tracking-wider text-outline font-semibold">Or quick role preset</span>
            </div>

            <!-- Instant Role Presets -->
            <div class="grid grid-cols-2 gap-2.5">
                <button class="flex items-center justify-center space-x-2 p-2.5 rounded-xl bg-surface-container/70 hover:bg-surface-container text-on-surface transition-all active:scale-[0.98] border border-outline-variant/30 cursor-pointer" onclick="fillRole('admin', 'Admin@123')" type="button">
                    <span class="material-symbols-outlined text-secondary text-[18px]">shield_person</span>
                    <span class="text-xs font-semibold">Admin</span>
                </button>
                <button class="flex items-center justify-center space-x-2 p-2.5 rounded-xl bg-surface-container/70 hover:bg-surface-container text-on-surface transition-all active:scale-[0.98] border border-outline-variant/30 cursor-pointer" onclick="fillRole('mechanic', 'Admin@123')" type="button">
                    <span class="material-symbols-outlined text-tertiary text-[18px]">build</span>
                    <span class="text-xs font-semibold">Mechanic</span>
                </button>
            </div>
        </div>
    </div>
</div>
</main>

<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script>
    if (API.getUser()) {
        window.location.href = 'index.html';
    }

    function togglePasswordVisibility() {
        const pwdInput = document.getElementById('passwordField');
        const eyeIcon = document.getElementById('eyeIcon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            eyeIcon.textContent = 'visibility_off';
        } else {
            pwdInput.type = 'password';
            eyeIcon.textContent = 'visibility';
        }
    }

    function fillRole(username, password) {
        const user = document.getElementById('userField');
        const pass = document.getElementById('passwordField');
        user.value = username;
        pass.value = password;
        user.classList.add('bg-secondary-fixed/40');
        setTimeout(() => user.classList.remove('bg-secondary-fixed/40'), 400);
        Toast.info(`Loaded ${username} credentials`);
    }

    async function handleAuthSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const originalText = btnText.textContent;
        const username = document.getElementById('userField').value.trim();
        const password = document.getElementById('passwordField').value.trim();

        if (!username || !password) {
            Toast.error('Please enter username and password');
            return;
        }

        try {
            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            btn.classList.add('opacity-85');

            const res = await API.post('/api/auth/login', { username, password });

            btnText.textContent = 'Handshake Established!';
            btn.classList.remove('from-secondary', 'to-secondary', 'via-secondary-container');
            btn.classList.add('bg-tertiary');

            if (res.user) {
                API.setUser(res.user);
            }
            Toast.success('Login Successful! Entering Hub...');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 600);

        } catch (err) {
            let msg = err.message || 'Authentication failed';
            if (msg.includes('ECONNREFUSED') || msg.includes('connect')) {
                msg = 'Database offline: start MariaDB via "sudo service mariadb start"';
            } else if (password === '1234') {
                msg = 'Backdoor "1234" removed for security. Use "Admin@123"';
            }
            Toast.error(msg);
            btnText.textContent = originalText;
            btn.disabled = false;
            btn.classList.remove('opacity-85', 'bg-tertiary');
            btn.classList.add('bg-gradient-to-r', 'from-secondary', 'via-secondary-container', 'to-secondary');
        }
    }
</script>
</body>
</html>
