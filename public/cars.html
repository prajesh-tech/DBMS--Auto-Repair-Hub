<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Repair Hub - Vehicles</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="navbar-brand">🔧 Auto Repair Hub</a>
    <div class="nav-links">
        <a href="index.html" class="nav-link">🏠 Dashboard</a>
        <a href="customer.html" class="nav-link">👤 Customers</a>
        <a href="cars.html" class="nav-link">🚗 Vehicles</a>
        <a href="employee.html" class="nav-link">👨‍🔧 Employees</a>
        <a href="services.html" class="nav-link">🛠 Services</a>
        <a href="parts.html" class="nav-link">📦 Inventory</a>
        <a href="analytics.html" class="nav-link">📊 Analytics</a>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="API.toggleTheme()">🌙 Dark</button>
        <span id="userBadge" style="font-weight:600; font-size:0.85rem; color:var(--text-secondary); background:var(--primary-light); padding:4px 8px; border-radius:6px;">👤 Admin</span>
        <button class="btn btn-secondary btn-sm" onclick="logout()">Logout ⏻</button>
    </div>
</nav>

<div class="container">

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">🚗 Vehicle Management</h2>
        </div>

        <!-- Add Car Form -->
        <form id="addCarForm" onsubmit="handleAddCar(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>VIN Number *</label>
                    <input type="text" id="car_vin" placeholder="1HGCR2F83HA000001" required maxLength="17">
                </div>
                <div class="form-group">
                    <label>Manufacturer *</label>
                    <input type="text" id="car_manufacturer" placeholder="Honda" required>
                </div>
                <div class="form-group">
                    <label>Model *</label>
                    <input type="text" id="car_model" placeholder="Accord" required>
                </div>
                <div class="form-group">
                    <label>Year *</label>
                    <input type="number" id="car_year" placeholder="2019" required>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="text" id="car_color" placeholder="Silver">
                </div>
                <div class="form-group">
                    <label>Customer *</label>
                    <select id="car_customer_id" required>
                        <option value="">Select Owner...</option>
                    </select>
                </div>
            </div>
            <div style="margin-bottom:20px;">
                <button type="submit" class="btn">➕ Add Vehicle</button>
            </div>
        </form>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by VIN, make, model, owner..." onkeyup="if(event.key==='Enter') loadCars(1)" oninput="if(this.value==='') loadCars(1)">
                <button class="btn btn-outline" onclick="loadCars(1)">Search</button>
            </div>
            <button class="btn btn-outline" onclick="loadCars(currentPage)">🔄 Refresh</button>
        </div>

        <!-- Vehicle Table rendering ALL fields -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>VIN</th>
                        <th>Owner</th>
                        <th>Make & Model</th>
                        <th>Year</th>
                        <th>Color</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="carTable">
                    <tr><td colspan="7" class="empty-state">Loading vehicles...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <span id="paginationInfo" style="font-size:0.9rem; color:var(--text-secondary);">Page 1 of 1</span>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-outline" id="prevBtn" onclick="changePage(-1)">Previous</button>
                <button class="btn btn-outline" id="nextBtn" onclick="changePage(1)">Next</button>
            </div>
        </div>

    </div>

</div>

<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/api.js"></script>
<script src="js/idle.js"></script>
<script>
API.requireAuth();

let currentPage = 1;
let totalPages = 1;
let customerList = [];
let carDataMap = {};

async function loadCustomersDropdown() {
    try {
        const res = await API.get('/api/customers?limit=1000');
        customerList = res.data || [];
        const select = document.getElementById('car_customer_id');
        select.innerHTML = '<option value="">Select Owner...</option>' + 
            customerList.map(c => `<option value="${c.customer_id}">${escapeHTML(c.name)} (#${c.customer_id})</option>`).join('');
    } catch (err) {
        console.error('Failed to populate customers dropdown:', err);
    }
}

async function loadCars(page = 1) {
    currentPage = page;
    const search = document.getElementById('searchInput').value.trim();

    try {
        const res = await API.get(`/api/cars?page=${page}&limit=10&search=${encodeURIComponent(search)}`);
        const tbody = document.getElementById('carTable');
        
        totalPages = res.pagination.totalPages || 1;
        document.getElementById('paginationInfo').innerText = `Page ${res.pagination.page} of ${totalPages} (${res.pagination.total} total)`;
        
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;

        if (!res.data || res.data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No vehicles found</td></tr>`;
            return;
        }

        carDataMap = {};
        res.data.forEach(c => { carDataMap[c.car_id] = c; });

        tbody.innerHTML = res.data.map(c => `
            <tr>
                <td>#${c.car_id}</td>
                <td><code class="vin-code">${escapeHTML(c.vin)}</code></td>
                <td><strong>${escapeHTML(c.customer_name || 'Unassigned')}</strong></td>
                <td>${escapeHTML(c.manufacturer)} ${escapeHTML(c.model)}</td>
                <td>${c.year}</td>
                <td>${escapeHTML(c.color || 'N/A')}</td>
                <td>
                    <button class="btn btn-outline btn-sm" onclick="openEditModal(${c.car_id})">✏️ Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="confirmDelete(${c.car_id})">🗑 Delete</button>
                </td>
            </tr>
        `).join('');

    } catch (err) {
        Toast.error(err.message || 'Failed to load vehicles');
    }
}

async function handleAddCar(e) {
    e.preventDefault();
    const vin = document.getElementById('car_vin').value.trim();
    const manufacturer = document.getElementById('car_manufacturer').value.trim();
    const model = document.getElementById('car_model').value.trim();
    const year = document.getElementById('car_year').value.trim();
    const color = document.getElementById('car_color').value.trim();
    const customer_id = document.getElementById('car_customer_id').value;

    try {
        await API.post('/api/cars', { vin, manufacturer, model, year, color, customer_id });
        Toast.success('Vehicle added successfully!');
        
        document.getElementById('car_vin').value = '';
        document.getElementById('car_manufacturer').value = '';
        document.getElementById('car_model').value = '';
        document.getElementById('car_year').value = '';
        document.getElementById('car_color').value = '';

        loadCars(1);
    } catch (err) {
        Toast.error(err.message || 'Failed to add vehicle');
    }
}

function openEditModal(id) {
    const c = carDataMap[id];
    if (!c) return;

    const custOptions = customerList.map(cust => 
        `<option value="${cust.customer_id}" ${cust.customer_id === c.customer_id ? 'selected' : ''}>${escapeHTML(cust.name)}</option>`
    ).join('');

    Modal.open({
        title: `Edit Vehicle #${id}`,
        bodyHTML: `
            <div class="form-group" style="margin-bottom:12px;">
                <label>VIN Number</label>
                <input type="text" id="edit_vin" value="${escapeHTML(c.vin || '')}">
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label>Manufacturer</label>
                <input type="text" id="edit_manufacturer" value="${escapeHTML(c.manufacturer || '')}">
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label>Model</label>
                <input type="text" id="edit_model" value="${escapeHTML(c.model || '')}">
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label>Year</label>
                <input type="number" id="edit_year" value="${c.year || ''}">
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label>Color</label>
                <input type="text" id="edit_color" value="${escapeHTML(c.color || '')}">
            </div>
            <div class="form-group">
                <label>Owner Customer</label>
                <select id="edit_customer_id">${custOptions}</select>
            </div>
        `,
        onConfirm: async () => {
            const editVin = document.getElementById('edit_vin').value.trim();
            const editMake = document.getElementById('edit_manufacturer').value.trim();
            const editModel = document.getElementById('edit_model').value.trim();
            const editYear = document.getElementById('edit_year').value.trim();
            const editColor = document.getElementById('edit_color').value.trim();
            const editCustId = document.getElementById('edit_customer_id').value;

            try {
                await API.put(`/api/cars/${id}`, { vin: editVin, manufacturer: editMake, model: editModel, year: editYear, color: editColor, customer_id: editCustId });
                Modal.close();
                Toast.success('Vehicle updated successfully');
                loadCars(currentPage);
            } catch (err) {
                Toast.error(err.message || 'Update failed');
            }
        }
    });
}

function confirmDelete(id) {
    Modal.confirm({
        title: 'Delete Vehicle',
        message: 'Are you sure you want to delete this vehicle record?',
        onConfirm: async () => {
            try {
                await API.delete(`/api/cars/${id}`);
                Toast.success('Vehicle deleted');
                loadCars(currentPage);
            } catch (err) {
                Toast.error(err.message || 'Delete failed');
            }
        }
    });
}

function changePage(delta) {
    const newPage = currentPage + delta;
    if (newPage >= 1 && newPage <= totalPages) {
        loadCars(newPage);
    }
}

function logout() {
    API.logout();
}

function escapeHTML(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function debounce(func, timeout = 300){
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => { func.apply(this, args); }, timeout);
  };
}

window.onload = () => {
    loadCustomersDropdown();
    loadCars(1);

    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.oninput = debounce(() => loadCars(1), 300);
    }
};
</script>

</body>
</html>
