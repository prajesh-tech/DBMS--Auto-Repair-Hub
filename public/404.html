<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link rel="stylesheet" href="css/tailwind.css?v=ui-shell-2"/>

<body data-page="404" class="min-h-screen flex flex-col items-center justify-center p-6 bg-surface text-on-surface antialiased relative overflow-hidden font-sans">

    <!-- Ambient Background Glows Shining Through Glass -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
        <div class="absolute -top-32 -left-20 w-[600px] h-[600px] rounded-full bg-[#2b69fa]/15 blur-[120px]"></div>
        <div class="absolute top-[35%] -right-32 w-[550px] h-[550px] rounded-full bg-[#008817]/15 blur-[100px]"></div>
        <div class="absolute -bottom-40 left-[20%] w-[500px] h-[500px] rounded-full bg-[#737575]/20 blur-[100px]"></div>
    </div>

    <!-- 404 Glass Card -->
    <div class="relative z-10 max-w-md w-full text-center bg-surface-container-low/75 backdrop-blur-2xl p-8 sm:p-10 rounded-2xl shadow-[0_8px_32px_0_rgba(0,0,0,0.1)] border border-outline-variant/30">
        <div class="flex justify-center mb-6">
            <img src="images/logo.webp" alt="Auto Repair Hub Logo" class="w-20 h-20 object-contain rounded-2xl drop-shadow-md" />
        </div>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-lowest/90 backdrop-blur-xl text-secondary text-xs font-semibold mb-4 border border-outline-variant/30 shadow-xs">
            <span class="material-symbols-outlined text-sm">warning</span>
            Error Code 404
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2 text-on-surface">
            Page Not Found
        </h1>
        <p class="text-xs sm:text-sm text-on-surface-variant mb-8 leading-relaxed">
            The page you are looking for may have been moved, decommissioned, or does not exist in the Auto Repair Hub telemetric system.
        </p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="index.html" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg bg-secondary-container hover:opacity-95 text-on-secondary-container font-semibold text-xs sm:text-sm transition-transform active:scale-95 shadow-md">
                <span class="material-symbols-outlined text-base">dashboard</span>
                Back to Dashboard
            </a>
            <button data-click="action1" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg bg-surface-container-high hover:bg-surface-container text-on-surface font-medium text-xs sm:text-sm transition-colors cursor-pointer border border-outline-variant/30">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                Go Back
            </button>
        </div>
        <div class="mt-8 pt-6 border-t border-outline-variant/20 text-[11px] text-on-surface-variant">
            Auto Repair Hub &bull; Fleet Telemetric Operations
        </div>
    </div>

<script src="js/api.js?v=ui-shell-2"></script>
