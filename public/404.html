<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="description" content="Auto Repair Hub - Page Not Found (404). Return to the telemetric fleet management operations dashboard."/>
    <title>404 - Page Not Found | Auto Repair Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico"/>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#0050d7",
                        "primary-hover": "#003da9",
                        accent: "#008918"
                    }
                }
            }
        };
    </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 dark:bg-[#0f172a] text-slate-800 dark:text-slate-100 transition-colors duration-300 font-sans">
    <div class="max-w-md w-full text-center bg-white/80 dark:bg-slate-900/80 backdrop-blur-md p-8 sm:p-10 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800">
        <div class="flex justify-center mb-6">
            <img src="images/logo_cropped.png" alt="Auto Repair Hub Logo" class="w-24 h-24 object-contain rounded-2xl drop-shadow-md" onerror="this.src='images/logo.png'"/>
        </div>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 text-xs font-semibold mb-4 border border-blue-200 dark:border-blue-900">
            <span class="material-symbols-outlined text-sm">warning</span>
            Error Code 404
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2 text-slate-900 dark:text-white">
            Page Not Found
        </h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
            The page you are looking for may have been moved, decommissioned, or does not exist in the Auto Repair Hub telemetric system.
        </p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="index.html" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm transition-all shadow-md hover:shadow-lg focus:ring-4 focus:ring-blue-500/20">
                <span class="material-symbols-outlined text-base">dashboard</span>
                Back to Dashboard
            </a>
            <button onclick="window.history.back()" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium text-sm transition-all">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                Go Back
            </button>
        </div>
        <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-400">
            Auto Repair Hub &bull; Fleet Telemetric Operations
        </div>
    </div>
    <script src="js/api.js"></script>
</body>
</html>
